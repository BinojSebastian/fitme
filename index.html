<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fit-Me">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Fit-Me – 10 Minuten Morgentraining für Nacken, Haltung und Fitness.">
<title>Fit-Me</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
/* ===================== Fit-Me · Gestaltung ===================== */
:root {
  --bg: #0E0F12; --card: #1A1C21; --card2: #23262C; --line: rgba(245, 246, 247, 0.08);
  --text: #F5F6F7; --muted: #9AA0A6; --acc: #C6F432; --acc-ink: #0E0F12;
  --blue: #3A6EA5; --red: #FF5A5F; --chart-v: #4C8DF0;
  --r: 18px;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  --phase: var(--acc);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body {
  color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none; touch-action: manipulation;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--acc); }
h1, h2, h3, p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
svg { display: block; }

/* ---------- Grundlayout & Tab-Leiste ---------- */
#app { min-height: 100%; }
#view {
  max-width: 640px; margin: 0 auto;
  padding: calc(var(--st) + 14px) calc(var(--sr) + 16px) calc(var(--sb) + 96px) calc(var(--sl) + 16px);
}
#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center;
  padding: 6px calc(var(--sr) + 8px) calc(var(--sb) + 6px) calc(var(--sl) + 8px);
  background: rgba(14, 15, 18, 0.9); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
#tabbar .tabs { display: flex; width: 100%; max-width: 560px; justify-content: space-around; }
.tab {
  min-width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.01em; border-radius: 12px;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--acc); }

/* ---------- Karten & Typo ---------- */
.card { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 2px 16px; }
.page-head h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.page-head .sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
.section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 22px 4px 8px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 700; font-size: 16px;
}
.btn svg { width: 22px; height: 22px; flex: none; }
.btn-big svg { width: 24px; height: 24px; }
.btn-primary { background: var(--acc); color: var(--acc-ink); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary[disabled] { opacity: 0.35; }
.btn-ghost { background: var(--card2); color: var(--text); }
.btn-ghost:active { background: #2c3037; }
.btn-danger { background: rgba(255, 90, 95, 0.14); color: var(--red); }
.btn-block { display: flex; width: 100%; }
.btn-big { min-height: 64px; font-size: 19px; border-radius: 18px; }
.icon-btn { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; color: var(--text); }
.icon-btn svg { width: 26px; height: 26px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px;
  background: var(--card2); font-weight: 600; font-size: 14px;
}

/* ---------- Abzeichen ---------- */
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px;
  background: rgba(245, 246, 247, 0.08); color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap;
}
.badge.acc { background: var(--acc); color: var(--acc-ink); }
.badge.outline { background: transparent; box-shadow: inset 0 0 0 1px rgba(198, 244, 50, 0.6); color: var(--acc); }
.badge svg { width: 13px; height: 13px; }

/* ---------- Heute ---------- */
.hello { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 4px 2px 16px; }
.hello h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; }
.hello .date { color: var(--muted); margin-top: 3px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--acc); flex: none; }
.status-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.status-week { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; margin-top: 2px; }
.status-week span { color: var(--muted); font-weight: 600; font-size: 18px; }
.streak-pill { display: flex; align-items: center; gap: 6px; background: rgba(198, 244, 50, 0.1); color: var(--acc); padding: 8px 12px; border-radius: 14px; flex: none; }
.streak-pill svg { width: 22px; height: 22px; }
.streak-pill b { font-size: 22px; font-weight: 800; line-height: 1; }
.streak-pill small { color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.1; display: block; }
.unit-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-weight: 600; }
.dots { display: flex; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(245, 246, 247, 0.12); }
.dots i.on { background: var(--acc); }
.dots i.now { box-shadow: inset 0 0 0 2px var(--acc); background: transparent; }
.levelbar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 14px; }
.levelbar i { height: 6px; border-radius: 3px; background: rgba(245, 246, 247, 0.1); }
.levelbar i.on { background: var(--acc); }
.levelbar i.now { background: rgba(198, 244, 50, 0.45); }
.levelbar-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
.plan { display: flex; gap: 12px; align-items: flex-start; }
.plan svg { width: 22px; height: 22px; color: var(--acc); flex: none; margin-top: 2px; }
.plan p { font-size: 16px; line-height: 1.4; }
.done-banner { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 16px; background: rgba(198, 244, 50, 0.1); color: var(--acc); font-weight: 700; margin-bottom: 12px; }
.done-banner svg { width: 22px; height: 22px; }
.done-banner small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.start-wrap { margin: 4px 0 16px; }
.routine-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.routine-head h2 { font-size: 19px; font-weight: 800; }
.routine-head .muted { font-size: 13px; }
.group-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 14px 0 4px; }
.group-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.ex-row { display: flex; align-items: center; gap: 12px; padding: 8px 6px; margin: 0 -6px; border-radius: 12px; cursor: pointer; }
.ex-row:active { background: rgba(245, 246, 247, 0.06); }
.routine-tip { color: var(--muted); font-size: 13px; margin: 2px 0 2px; }
.pv-fig { height: 230px; background: #121418; border-radius: 16px; margin: 4px 0 12px; overflow: hidden; }
.pv-fig svg { width: 100%; height: 100%; }
.pv-badges { margin-bottom: 10px; }
.pv-note { font-size: 14px; }
.ex-row + .ex-row { border-top: 1px solid var(--line); }
.ex-idx { width: 18px; text-align: center; color: var(--muted); font-size: 13px; font-weight: 700; flex: none; }
.thumb { width: 64px; height: 56px; border-radius: 12px; background: #121418; flex: none; overflow: hidden; }
.thumb svg { width: 100%; height: 100%; }
.ex-main { flex: 1; min-width: 0; }
.ex-name { font-weight: 650; line-height: 1.25; }
.ex-meta { margin-top: 5px; }
.info-link { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 12px; flex: none; }
.info-link svg { width: 20px; height: 20px; }
.level-done-card { text-align: center; padding: 22px 18px; }
.level-done-card svg.medal { width: 56px; height: 56px; color: var(--acc); margin: 0 auto 10px; }
.level-done-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
.level-done-card p { color: var(--muted); margin-bottom: 16px; }

/* ---------- Kalender ---------- */
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.stat-row .card { margin: 0; }
.stat .val { font-size: 34px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; display: flex; align-items: center; gap: 6px; }
.stat .val svg { width: 26px; height: 26px; color: var(--acc); }
.stat .lbl { color: var(--muted); font-size: 13px; font-weight: 600; margin-top: 4px; }
.month-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.month-head b { font-size: 18px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .wd { font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 0 6px; }
.cal .d { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; border-radius: 50%; position: relative; max-height: 52px; }
.cal .d.future { color: rgba(154, 160, 166, 0.45); }
.cal .d.trained { background: var(--acc); color: var(--acc-ink); font-weight: 800; }
.cal .d.today { box-shadow: inset 0 0 0 2px var(--text); }
.cal .d.trained.today { box-shadow: inset 0 0 0 2px var(--acc-ink), 0 0 0 2px var(--acc); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.note { color: var(--muted); font-size: 14px; line-height: 1.45; padding: 0 4px; }

/* ---------- Verlauf ---------- */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.kpi-grid .card { margin: 0; }
.kpi .val { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.kpi .val small { font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.kpi .lbl { color: var(--muted); font-size: 13px; font-weight: 600; margin-top: 4px; line-height: 1.3; }
.kpi.wide { grid-column: 1 / -1; }
.trend { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.trend .arrow { color: var(--acc); font-weight: 800; }
.seg { display: inline-flex; background: var(--card2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { min-height: 38px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 650; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.chart-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.chart-head h2 { font-size: 18px; font-weight: 800; }
.chart-legend { display: flex; gap: 16px; font-size: 13px; color: var(--text); margin-bottom: 6px; flex-wrap: wrap; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart-tip {
  position: absolute; top: 0; pointer-events: none; background: #2a2e35; border-radius: 10px; padding: 8px 10px;
  font-size: 13px; line-height: 1.35; white-space: nowrap; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); display: none; z-index: 2;
}
.chart-tip b { display: block; font-size: 12px; color: var(--muted); font-weight: 650; margin-bottom: 2px; }
.chart-tip i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
details.table-view { margin-top: 12px; }
details.table-view summary { cursor: pointer; color: var(--muted); font-weight: 650; font-size: 14px; min-height: 44px; display: flex; align-items: center; }
table.vals { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.vals th, table.vals td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); }
table.vals th { color: var(--muted); font-weight: 650; font-size: 12px; }

/* ---------- Einstellungen ---------- */
.list { background: var(--card); border-radius: var(--r); overflow: hidden; margin-bottom: 12px; }
.list-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 16px; text-align: left; }
.list-item + .list-item { border-top: 1px solid var(--line); }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .t { font-weight: 600; }
.list-item .s { color: var(--muted); font-size: 13px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; }
.list-item .chev { color: var(--muted); width: 18px; height: 18px; flex: none; }
.list-item.danger .t { color: var(--red); }
.list-item .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--card2); display: flex; align-items: center; justify-content: center; flex: none; }
.list-item .ic svg { width: 20px; height: 20px; }
.list-item .ic.acc { color: var(--acc); }
.switch { width: 52px; height: 32px; border-radius: 16px; background: #3a3e45; position: relative; flex: none; transition: background 0.2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.switch.on { background: var(--acc); }
.switch.on::after { transform: translateX(20px); background: var(--acc-ink); }
.version { text-align: center; color: var(--muted); font-size: 13px; margin: 18px 0 6px; }

/* ---------- Ebenen (Vollbild-Abläufe, Dialoge) ---------- */
#layer:empty { display: none; }
body.layer-open { overflow: hidden; }
body.layer-open #app { display: none; }
.screen {
  position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(var(--st) + 18px) calc(var(--sr) + 20px) calc(var(--sb) + 24px) calc(var(--sl) + 20px);
}
.screen-inner { max-width: 520px; margin: 0 auto; }
.ob-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; margin: 10px 0 26px; }
.ob-logo img, .ob-logo svg { width: 44px; height: 44px; border-radius: 11px; }
.ob h1 { font-size: 32px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
.ob .lead { color: var(--muted); margin-bottom: 24px; }
.field { display: block; margin-bottom: 18px; }
.field > span { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.02em; }
.input {
  width: 100%; min-height: 52px; padding: 13px 14px; border-radius: 14px; background: var(--card);
  border: 1px solid rgba(245, 246, 247, 0.1); outline: none; font-size: 17px; resize: none;
}
.input:focus { border-color: var(--acc); }
textarea.input { line-height: 1.4; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.safety { border: 1px solid rgba(255, 90, 95, 0.35); background: rgba(255, 90, 95, 0.06); }
.safety b { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.safety svg { width: 20px; height: 20px; color: var(--red); }
.check { display: flex; align-items: center; gap: 12px; margin-top: 12px; min-height: 44px; font-weight: 650; }
.check input { width: 26px; height: 26px; accent-color: var(--acc); flex: none; }
.btn-row { display: flex; gap: 10px; margin-top: 8px; }
.btn-row .btn { flex: 1; }

/* Abfrage & Erfolg */
.rate h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 8px 0 4px; }
.scale { margin-top: 22px; }
.scale-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.scale-head b { font-size: 17px; }
.scale-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale-grid button {
  min-height: 54px; border-radius: 14px; background: var(--card); font-size: 20px; font-weight: 800;
  font-variant-numeric: tabular-nums; border: 1px solid transparent;
}
.scale-grid button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); }
.scale-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
.success { text-align: center; }
.success .big-check { width: 96px; height: 96px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); display: flex; align-items: center; justify-content: center; margin: 24px auto 16px; animation: pop 0.5s cubic-bezier(.2, 1.4, .4, 1); }
.success .big-check svg { width: 52px; height: 52px; }
.success h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.success .lead { color: var(--muted); margin-top: 6px; font-size: 17px; }
.success .stat-row { margin-top: 20px; text-align: left; }
.tip-card { text-align: left; border: 1px solid rgba(198, 244, 50, 0.3); margin-top: 18px; opacity: 0; transform: translateY(14px); transition: opacity 0.45s, transform 0.45s; }
.tip-card.show { opacity: 1; transform: none; }
.tip-card .eyebrow { color: var(--acc); display: flex; align-items: center; gap: 6px; }
.tip-card .eyebrow svg { width: 16px; height: 16px; }
.tip-card p { font-size: 17px; line-height: 1.45; margin: 8px 0 10px; }
.tip-card .src { color: var(--muted); font-size: 13px; }
@keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.compare { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 10px; text-align: center; }
.compare .v { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
.compare .l { color: var(--muted); font-size: 13px; }
.compare .arr { color: var(--acc); }
.compare .arr svg { width: 28px; height: 28px; }

/* Dialog */
.dlg-back { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end; justify-content: center; padding: 16px calc(var(--sr) + 12px) calc(var(--sb) + 12px) calc(var(--sl) + 12px); }
.dlg { width: 100%; max-width: 480px; max-height: 86vh; overflow-y: auto; background: var(--card); border-radius: 22px; padding: 20px; animation: up 0.22s ease-out; }
.dlg h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
.dlg .txt { color: var(--muted); line-height: 1.45; }
.dlg .txt p + p { margin-top: 8px; }
.dlg .input { margin-top: 12px; }
.dlg .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.dlg ol { padding-left: 20px; margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.dlg ol li + li { margin-top: 6px; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 700px) { .dlg-back { align-items: center; } }

#toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 92px); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 650; font-size: 15px; z-index: 80; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Trainingsmodus ---------- */
.training {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); cursor: pointer; user-select: none; -webkit-user-select: none;
  display: flex; flex-direction: column; overflow: hidden;
  padding: calc(var(--st) + 6px) calc(var(--sr) + 14px) calc(var(--sb) + 10px) calc(var(--sl) + 14px);
}
.training::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--phase) 16%, transparent), transparent 70%); pointer-events: none; transition: background 0.3s; }

.tr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; }
.tr-prog { text-align: center; font-size: 14px; font-weight: 650; color: var(--muted); line-height: 1.25; }
.tr-prog b { color: var(--text); font-size: 16px; display: block; }
.tr-bar { height: 4px; border-radius: 2px; background: rgba(245, 246, 247, 0.1); margin: 6px 4px 0; overflow: hidden; position: relative; }
.tr-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--phase); border-radius: 2px; width: 0; }
.tr-main { flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(120px, 1fr) auto auto; gap: 4px; position: relative; padding-top: 10px; }
.tr-head { text-align: center; }
.tr-phase { font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--phase); }
.tr-name { font-size: clamp(24px, 6.4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; margin-top: 2px; }
.tr-badges { justify-content: center; margin-top: 8px; min-height: 24px; }
.tr-fig { min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
.tr-fig svg { width: 100%; height: 100%; max-height: 100%; }
.tr-hint { text-align: center; color: var(--muted); font-size: clamp(15px, 3.9vw, 19px); line-height: 1.35; max-width: 560px; margin: 0 auto; min-height: 2.7em; }
.tr-clock { position: relative; width: min(62vw, 34vh, 300px); aspect-ratio: 1; margin: 6px auto 0; cursor: pointer; }
.tr-clock svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.tr-clock .track { stroke: rgba(245, 246, 247, 0.1); }
.tr-clock .prog { stroke: var(--phase); transition: stroke 0.3s; }
.tr-num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: min(27vw, 15vh, 132px); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 1;
}
.tr-num.final { color: var(--phase); animation: beat 1s ease-out infinite; }
@keyframes beat { 0% { transform: scale(1.16); } 60% { transform: scale(1); } 100% { transform: scale(1); } }
.tr-controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; position: relative; }
.tr-controls .btn { flex: 1; max-width: 220px; }
.tr-side, .tr-paused {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; pointer-events: none;
  font-size: clamp(34px, 9vw, 64px); font-weight: 900; letter-spacing: -0.02em; color: var(--acc);
  text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8); opacity: 0; transition: opacity 0.25s;
}
.tr-side.show { opacity: 1; animation: sidepop 1.8s ease-out; }
.tr-side.pre { opacity: 1; color: var(--text); font-size: clamp(24px, 6.5vw, 42px); }
@keyframes sidepop { 0% { transform: translateY(-50%) scale(0.7); } 18% { transform: translateY(-50%) scale(1.08); } 30%, 100% { transform: translateY(-50%) scale(1); } }
.training.is-paused .tr-paused { opacity: 1; color: var(--text); }
.training.is-paused .tr-main, .training.is-paused .tr-controls { opacity: 0.25; }
.tr-paused small { display: block; font-size: 17px; font-weight: 600; color: var(--muted); margin-top: 6px; letter-spacing: 0; }
.tr-next-floor { color: var(--acc); font-weight: 700; }

#flash { position: fixed; inset: 0; z-index: 90; background: var(--acc); opacity: 0; pointer-events: none; }
#flash.on { animation: flash 300ms ease-out; }
@keyframes flash { 0% { opacity: 0; } 30% { opacity: 0.4; } 100% { opacity: 0; } }

/* Querformat (iPad, iPhone quer) */
@media (orientation: landscape) and (min-width: 700px) {
  .tr-main { grid-template-columns: 1.15fr 1fr; grid-template-rows: auto 1fr auto; column-gap: 28px; }
  .tr-head { grid-column: 1; grid-row: 1; }
  .tr-fig { grid-column: 1; grid-row: 2; }
  .tr-hint { grid-column: 1; grid-row: 3; }
  .tr-clock { grid-column: 2; grid-row: 1 / span 3; align-self: center; width: min(40vw, 62vh, 420px); }
  .tr-num { font-size: min(17vw, 26vh, 180px); }
}
@media (min-width: 700px) and (orientation: portrait) {
  .tr-clock { width: min(52vw, 32vh, 380px); }
  .tr-num { font-size: min(22vw, 14vh, 170px); }
}

/* Figur */
@keyframes fmPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.fm-pulse { animation: fmPulse 4s ease-in-out infinite; }
.fm-arrow { animation: arrowBlink 1.6s ease-in-out infinite; }
@keyframes arrowBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

@media (prefers-reduced-motion: reduce) {
  .tr-num.final, .fm-pulse, .fm-arrow { animation: none; }
}

    return '<button class="list-item' + (danger ? ' danger' : '') + '" data-act="' + act + '"><div class="ic">' + icon + '</div><div class="grow"><div class="t">' + t + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>' + (extra || '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>') + '</button>';
  }
  function viewEinst(p) {
    var h = '<header class="page-head"><div><h1>Einstellungen</h1></div></header>';
    h += '<div class="section-title">Profile</div><div class="list">';
    store.profile.forEach(function (q) {
      var me = q.id === p.id, pq = L.progress(q);
      h += '<button class="list-item" data-act="profilMenu" data-id="' + q.id + '"><div class="ic' + (me ? ' acc' : '') + '">' + I.user + '</div><div class="grow"><div class="t">' + esc(q.name) + (me ? ' <span class="muted">· aktiv</span>' : '') + '</div>' +
        '<div class="s">Level ' + pq.level + ' · Woche ' + pq.woche + ' von 12 · ' + L.counted(q).length + ' Einheiten</div></div><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>';
    });
    h += item('profilNeu', I.plus, 'Profil anlegen', 'Für weitere Personen – mit eigenem Fortschritt') + '</div>';
    h += '<div class="section-title">Training</div><div class="list">' +
      item('toene', p.stumm ? I.mute : I.speaker, 'Signaltöne', 'Dezente Töne bei Start, Halbzeit und in den letzten 3 Sekunden', false,
        '<span class="switch' + (p.stumm ? '' : ' on') + '" role="switch" aria-checked="' + (!p.stumm) + '"></span>') +
      item('plan', I.plan, 'Wenn-Dann-Plan', esc(p.wennDannPlan || 'Noch kein Plan festgelegt')) + '</div>';
    h += '<div class="section-title">Datensicherung</div><div class="list">' +
      item('backupKopie', I.copy, 'Backup kopieren', 'Kompletter Datenstand in die Zwischenablage') +
      item('backupDatei', I.download, 'Als JSON speichern', 'Datei z. B. in „Dateien“ ablegen') +

    h += '<div class="section-title">Fortschritt</div><div class="list">' +
      item('levelNeu', I.refresh, 'Level ' + p.level + ' neu starten', 'Zurück auf Woche 1 – dein Verlauf bleibt erhalten') +
      item('allesReset', I.trash, 'Gesamten Fortschritt zurücksetzen', 'Löscht alle Einheiten dieses Profils', true) + '</div>';
    h += '<div class="section-title">Info</div><div class="list">' +
      item('hinweis', I.heart, 'Gesundheitshinweis', 'Bitte vor dem Training lesen') +
      item('quellen', I.book, 'Wissenschaftliche Quellen', FM.QUELLEN.length + ' Studien und Leitlinien') + '</div>';
    h += '<div class="version">Fit-Me ' + esc(FM.APP_VERSION || '') + '</div>';
    return h;
  }
  var VIEWS = { heute: viewHeute, kalender: viewKalender, verlauf: viewVerlauf, einstellungen: viewEinst };

  /* ================= F1 · Erster Start & neues Profil ================= */
  var PLAENE = [
    ['Nach dem Aufstehen', 'Wenn ich aufgestanden bin, trainiere ich direkt 10 Minuten mit Fit-Me.'],
    ['Nach dem Zähneputzen', 'Wenn ich mir morgens die Zähne geputzt habe, trainiere ich 10 Minuten mit Fit-Me.'],
    ['Unterwegs', 'Wenn ich im Hotel aufwache, trainiere ich vor dem Frühstück 10 Minuten mit Fit-Me.']
  ];
  var HINWEIS_KURZ = 'Übungen langsam und schmerzfrei ausführen; bei starken oder anhaltenden Beschwerden ärztlich abklären.';
  function showOnboarding(add) {
    var h = '<div class="screen ob"><div class="screen-inner">' +
      '<div class="ob-logo">' + LOGO + 'Fit-Me</div>' +
      '<h1>' + (add ? 'Neues Profil' : '10 Minuten.<br>Jeden Morgen.') + '</h1>' +
      '<p class="lead">' + (add ? 'Jedes Profil hat eigenen Fortschritt, eigene Serie und eigene Bewertungen.' : 'Dein Training für Nacken, Haltung und Fitness – nur mit dem eigenen Körpergewicht.') + '</p>' +
      '<label class="field"><span>Dein Name</span><input class="input" id="obName" maxlength="30" autocomplete="given-name" enterkeyhint="next"></label>' +
      '<label class="field"><span>Dein Wenn-Dann-Plan</span><textarea class="input" id="obPlan" rows="3" maxlength="200">' + esc(PLAENE[0][1]) + '</textarea></label>' +
      '<div class="chips" style="margin:-8px 0 18px">' + PLAENE.map(function (pl, i) { return '<button class="chip" data-act="obPlan" data-i="' + i + '">' + esc(pl[0]) + '</button>'; }).join('') + '</div>' +
      '<div class="card safety"><b>' + I.warn + 'Sicherheitshinweis</b><p class="muted">' + HINWEIS_KURZ + '</p>' +
      '<label class="check"><input type="checkbox" id="obOk"> Verstanden</label></div>' +
      '<button class="btn btn-primary btn-big btn-block" id="obGo" data-act="obFertig" data-add="' + (add ? 1 : 0) + '" disabled>' + (add ? 'Profil anlegen' : 'Los geht’s') + '</button>' +
      (add ? '<button class="btn btn-ghost btn-block" style="margin-top:8px" data-act="schliessen">Abbrechen</button>' : '') +
      '</div></div>';
    layer(h);
    var name = $('#obName'), ok = $('#obOk'), go = $('#obGo');
    function upd() { go.disabled = !(name.value.trim() && ok.checked); }
    name.addEventListener('input', upd); ok.addEventListener('change', upd);

  /* ================= F3 · Trainingsmodus ================= */
  var T = null;
  var RING_C = 2 * Math.PI * 90;
  function trBadges(e, power, toFloor, runde) {
    var b = ['<span class="badge">' + (e.pos === 'boden' ? I.floor : '') + FM.POS_LABEL[e.pos] + '</span>'];
    if (runde) b.push('<span class="badge num">Runde ' + runde + '/' + FM.RUNDEN + '</span>');
    if (power) b.push('<span class="badge acc">' + I.bolt + 'Vollgas</span>');
    if (e.side) b.push('<span class="badge">' + I.swap + (e.halbzeit ? 'Wechsel zur Halbzeit' : 'Seitenwechsel') + '</span>');
    if (e.ref) b.push('<span class="badge outline">' + e.ref + '</span>');
    if (toFloor) b.push('<span class="badge acc">' + I.floor + 'Jetzt zum Boden</span>');
    return b.join('');
  }
  function buildTrainingUI() {
    var p = prof();
    layer('<div class="training" data-phase="uebung">' +
      '<div class="tr-top"><button class="icon-btn" data-act="abbrechen" aria-label="Training abbrechen">' + I.close + '</button>' +
      '<div class="tr-prog"><b class="num" id="trCount"></b><span class="num" id="trRest"></span></div>' +
      '<button class="icon-btn" data-act="mute" id="trMute" aria-label="Töne ein- oder ausschalten">' + (p.stumm ? I.mute : I.speaker) + '</button></div>' +
      '<div class="tr-bar"><i id="trBar"></i></div>' +
      '<div class="tr-main"><div class="tr-head"><div class="tr-phase" id="trPhase"></div><div class="tr-name" id="trName"></div><div class="tr-badges badges" id="trBadges"></div></div>' +
      '<div class="tr-fig" id="trFig"></div><div class="tr-hint" id="trHint"></div>' +
      '<div class="tr-clock" data-act="pausetoggle" role="button" aria-label="Pause oder weiter"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="90" fill="none" stroke-width="12"/>' +
      '<circle class="prog" id="trRing" cx="100" cy="100" r="90" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + RING_C.toFixed(2) + '" stroke-dashoffset="0"/></svg>' +
      '<div class="tr-num" id="trNum" role="timer" aria-live="off"></div></div></div>' +
      '<div class="tr-controls"><button class="btn btn-ghost" data-act="skip">Überspringen</button><button class="btn btn-ghost" data-act="pausetoggle" id="trPauseBtn">Pause</button></div>' +
      '<div class="tr-side" id="trSide">Seite wechseln</div>' +
      '<div class="tr-paused">Pausiert<small>Tippen zum Fortsetzen</small></div></div>');
    T.fig = new FM.Figure($('#trFig'));
    // Antippen der freien Fläche setzt nur fort – pausiert wird bewusst über den Button oder die Uhr
    $('.training').addEventListener('click', function (e) {
      if (e.target.closest('[data-act]')) return;
      if (T && T.pausedAt !== null) resumeTraining();
    });
  }
  function enterStep() {
    var st = T.ses.steps[T.i], isPause = st.typ === 'pause';
    var e = EX[isPause ? st.next : st.ex];
    $('.training').setAttribute('data-phase', isPause ? 'pause' : 'uebung');
    $('#trPhase').textContent = isPause ? (st.uebergang ? 'Position einnehmen · als Nächstes' : 'Pause · als Nächstes') : (st.warm ? 'Warm-up' : (st.power ? 'Vollgas!' : 'Übung'));
    $('#trName').textContent = e.name;
    $('#trBadges').innerHTML = trBadges(e, isPause ? st.nextPower : st.power, isPause && st.zumBoden, isPause ? st.nextRunde : st.runde);
    $('#trHint').textContent = e.hint;
    $('#trNum').classList.remove('final');
    T.half = false; T.pre = false; T.animOffset = 0; T.fired = {}; T.lastShown = null;
    var sd = $('#trSide'); sd.classList.remove('show', 'pre');
    T.fig.set(e.anim, { mirror: false });
    var nr = isPause ? T.ses.steps[T.i + 1].nr : st.nr;
    $('#trCount').textContent = 'Übung ' + nr + ' von ' + T.ses.anzahl;
  }
  function remainingTotal(rem) {
    var s = rem;
    for (var j = T.i + 1; j < T.ses.steps.length; j++) s += T.ses.steps[j].dauer;
    return s;
  }
  function tick() {
    if (!T || T.ended) return;
    T.raf = requestAnimationFrame(tick);
    if (T.pausedAt !== null) return;
    var now = performance.now(), st = T.ses.steps[T.i];
    var el = (now - T.stepStart) / 1000, rem = st.dauer - el;
    if (rem <= 0) { nextStep(T.stepStart + st.dauer * 1000, false); return; }
    var e = EX[st.typ === 'pause' ? st.next : st.ex];
    if (st.typ === 'uebung' && e.side && !T.pre && !T.half && el >= st.dauer / 2 - 2) preWarn(e);
    if (st.typ === 'uebung' && e.side && !T.half && el >= st.dauer / 2) halfTime(e, el);
    for (var k = 3; k >= 1; k--) {
      if (rem <= k && !T.fired[k]) { T.fired[k] = true; Sound.play('tick'); $('#trNum').classList.add('final'); break; }
    }
    var shown = Math.ceil(rem - 0.0005);
    if (shown !== T.lastShown) {
      T.lastShown = shown;
      $('#trNum').textContent = shown;
      var tot = remainingTotal(rem);
      $('#trRest').textContent = 'noch ' + mmss(tot);
      $('#trBar').style.width = (100 * (1 - tot / T.ses.gesamt)).toFixed(2) + '%';
    }
    $('#trRing').setAttribute('stroke-dashoffset', (RING_C * Math.min(1, el / st.dauer)).toFixed(1));
    T.fig.render(el - T.animOffset);
  }
  function preWarn(e) {
    T.pre = true;
    Sound.play('vor');
    var s = $('#trSide');
    s.textContent = e.vorwarnung || 'Gleich Seite wechseln';
    s.classList.remove('show');
    s.classList.add('pre');
  }
  function halfTime(e, el) {
    T.half = true;
    flash();
    Sound.play('side');
    var s = $('#trSide');
    s.classList.remove('pre');
    s.textContent = e.halbzeit || 'Seite wechseln';
    restart(s, 'show');
    clearTimeout(T.sideT);
    T.sideT = setTimeout(function () { s.classList.remove('show'); }, 1800);
    if (e.anim2) { T.fig.set(e.anim2, { mirror: !!e.mirror2 }); T.animOffset = el; }
  }
  function nextStep(boundary, skipped) {
    var st = T.ses.steps[T.i];
    if (st.typ === 'uebung' && st.haupt && skipped) T.skipped++;
    if (T.i >= T.ses.steps.length - 1) { finishTraining(false); return; }
    T.i++;
    T.stepStart = boundary;
    var nx = T.ses.steps[T.i];
    flash();
    Sound.play(nx.typ === 'uebung' ? 'start' : 'end');
    enterStep();
  }
  function pauseTraining() {
    if (!T || T.ended || T.pausedAt !== null) return;
    T.pausedAt = performance.now();
    $('#trSide').classList.remove('show', 'pre');
    $('.training').classList.add('is-paused');
    $('#trPauseBtn').textContent = 'Weiter';
  }
  function resumeTraining() {
    if (!T || T.ended || T.pausedAt === null) return;
    Sound.unlock(); Wake.on();
    var d = performance.now() - T.pausedAt;
    T.stepStart += d; T.pausedMs += d; T.pausedAt = null;
    $('.training').classList.remove('is-paused');
    $('#trPauseBtn').textContent = 'Pause';
  }
  function togglePause() { if (!T) return; if (T.pausedAt !== null) resumeTraining(); else pauseTraining(); }
  function finishTraining(aborted) {
    if (!T || T.ended) return;
    var now = performance.now();
    T.ended = true;
    cancelAnimationFrame(T.raf);
    clearTimeout(T.sideT);
    Wake.off();
    var paused = T.pausedMs + (T.pausedAt !== null ? now - T.pausedAt : 0);
    var res = { dauerSek: Math.round((now - T.startedAt - paused) / 1000), uebersprungen: T.skipped };
    T = null;
    if (aborted) { closeLayer(); render(); toast('Training abgebrochen – diese Einheit zählt nicht.'); return; }
    Sound.play('done');
    if (!L.unitValid(res.uebersprungen, false)) { showInvalid(res.uebersprungen); return; }
    showRating(res);
  }

  /* ================= F4 · Abfrage, Erfolg, F9 Tipp, F7 Level ================= */
  var pending = null;
  function scale(key, title, lo, hi) {
    var b = '';
    for (var i = 1; i <= 10; i++) b += '<button data-act="rate" data-k="' + key + '" data-v="' + i + '" aria-pressed="false" class="num">' + i + '</button>';
    return '<div class="scale" role="group" aria-label="' + esc(title) + '"><div class="scale-head"><b>' + esc(title) + '</b></div><div class="scale-grid">' + b + '</div>' +
      '<div class="scale-ends"><span>' + lo + '</span><span>' + hi + '</span></div></div>';
  }
  function showRating(res) {
    pending = { res: res, v: null, b: null };
    layer('<div class="screen rate"><div class="screen-inner"><div class="eyebrow" style="margin-top:10px;color:var(--acc)">Training beendet</div>' +
      '<h1>Wie fühlst du dich jetzt?</h1><p class="muted">Zwei kurze Antworten, dann bist du fertig.</p>' +
      scale('v', 'Nacken-/Schulterverspannung', '1 = keine', '10 = sehr stark') +
      scale('b', 'Wohlbefinden', '1 = sehr schlecht', '10 = sehr gut') +
      '<button class="btn btn-primary btn-big btn-block" style="margin-top:26px" id="rateSave" data-act="rateSave" disabled>Speichern</button></div></div>');
  }
  function showSuccess(p, r, tip) {
    var st = L.streak(p);
    var title = r.zusatz ? 'Extra-Runde geschafft!' : (r.levelFertig ? 'Level ' + r.einheit.level + ' komplett!' : (r.wocheFertig ? 'Woche ' + r.woche + ' geschafft!' : 'Stark, ' + p.name + '!'));
    var lead = r.zusatz ? 'Zusätzliches Training – zählt nicht doppelt für die Woche.'
      : 'Einheit ' + r.nrInWoche + ' von 5 · Woche ' + r.woche + ' von 12' + (r.wocheFertig && !r.levelFertig ? '. Ab der nächsten Einheit startet Woche ' + (r.woche + 1) + '.' : '');
    layer('<div class="screen success"><div class="screen-inner"><div class="big-check">' + I.check + '</div><h1>' + esc(title) + '</h1><p class="lead">' + esc(lead) + '</p>' +
      '<div class="stat-row"><div class="card stat"><div class="val num">' + I.flame + st.aktuell + '</div><div class="lbl">' + (st.aktuell === 1 ? 'Tag' : 'Tage') + ' Serie</div></div>' +
      '<div class="card stat"><div class="val num">' + mmss(r.einheit.dauerSek) + '</div><div class="lbl">Minuten trainiert</div></div></div>' +
      '<div class="card tip-card" id="tipCard"><div class="eyebrow">' + I.bulb + 'Tipp des Tages · ' + esc(FM.TIPP_KAT_LABEL[tip.kat]) + '</div><p>' + esc(tip.text) + '</p><div class="src">Quelle: ' + esc(tip.quelle) + '</div></div>' +
      '<button class="btn btn-primary btn-big btn-block" style="margin-top:18px" data-act="successFertig" data-level="' + (r.levelFertig ? 1 : 0) + '">' + (r.levelFertig ? 'Weiter' : 'Fertig') + '</button></div></div>');
    setTimeout(function () { var c = $('#tipCard'); if (c) c.classList.add('show'); }, 900);
  }
  function compareBlock(a, b, lowerBetter) {
    var diff = (a != null && b != null) ? b - a : null, txt = '';
    if (diff != null) {
      var better = lowerBetter ? diff < 0 : diff > 0;
      txt = '<p class="muted" style="margin-top:8px;text-align:center">' + (diff === 0 ? 'Unverändert' : (diff > 0 ? '+' : '–') + fmt1(Math.abs(diff)) + ' Punkte' + (better ? ' – klasse!' : '')) + '</p>';
    }
    return '<div class="compare"><div><div class="v num">' + fmt1(a) + '</div><div class="l">Woche 1</div></div><div class="arr">' + I.arrowR + '</div>' +
      '<div><div class="v num" style="color:var(--acc)">' + fmt1(b) + '</div><div class="l">Woche 12</div></div></div>' + txt;
  }
  function showLevelDone() {
    var p = prof(), c = L.levelVergleich(p, p.level, p.runde), one = p.level === 1;
    layer('<div class="screen success"><div class="screen-inner"><div class="big-check">' + I.medal + '</div><h1>Level ' + p.level + ' geschafft!</h1>' +
      '<p class="lead">60 Einheiten – aus dem Vorsatz ist eine Gewohnheit geworden.</p>' +
      '<div class="card" style="text-align:left;margin-top:20px"><div class="eyebrow">Ø Nacken-/Schulterverspannung</div>' + compareBlock(c.v1, c.v12, true) + '</div>' +
      '<div class="card" style="text-align:left"><div class="eyebrow">Ø Wohlbefinden</div>' + compareBlock(c.b1, c.b12, false) + '</div>' +
      '<button class="btn btn-primary btn-big btn-block" style="margin-top:8px" data-act="level2">' + (one ? 'Level 2 starten' : 'Level 2 wiederholen') + '</button>' +
      '<button class="btn btn-ghost btn-block" style="margin-top:8px" data-act="schliessen">Später</button></div></div>');
  }
  function showInvalid(skipped) {
    layer('<div class="screen success"><div class="screen-inner"><div class="big-check" style="background:var(--card2);color:var(--muted)">' + I.info + '</div>' +
      '<h1>Diese Einheit zählt nicht</h1><p class="lead">Du hast ' + skipped + ' Übungen übersprungen. Damit eine Einheit zählt, brauchst du mindestens 6 der 8 Hauptintervalle.</p>' +
      '<button class="btn btn-primary btn-big btn-block" style="margin-top:24px" data-act="schliessen">Zurück zu Heute</button></div></div>');
  }

  /* ================= Aktionen ================= */
  var A = {};
  A.tab = function (el) { ui.tab = el.getAttribute('data-tab'); render(); window.scrollTo(0, 0); };
  A.schliessen = function () { closeLayer(); render(); };
  A.monat = function (el) {
    var y = +ui.monat.slice(0, 4), m = +ui.monat.slice(5, 7) - 1 + (+el.getAttribute('data-d'));
    var d = new Date(Date.UTC(y, m, 1));
    ui.monat = d.getUTCFullYear() + '-' + (d.getUTCMonth() < 9 ? '0' : '') + (d.getUTCMonth() + 1);
    render();
  };
  A.modus = function (el) { ui.modus = el.getAttribute('data-m'); render(); };

  // Onboarding
  A.obPlan = function (el) { $('#obPlan').value = PLAENE[+el.getAttribute('data-i')][1]; };
  A.obFertig = function (el) {
    var name = $('#obName').value.trim(), plan = $('#obPlan').value.trim();
    if (!name || !$('#obOk').checked) return;
    var p = L.newProfile(name, plan || PLAENE[0][1]);
    var add = el.getAttribute('data-add') === '1';
    if (add) { var cur = prof(); if (cur) p.stumm = cur.stumm; }
    store.profile.push(p);
    store.aktivesProfil = p.id;
    save();
    closeLayer();
    ui.tab = 'heute';
    render();
    if (add) toast('Profil „' + name + '“ angelegt und aktiv.');
  };

  // Training
  A.start = function () {
    var p = prof();
    if (!p || T) return;
    Sound.unlock();          // iOS: Audio und Wake Lock synchron im Tipp entsperren
    Wake.on();
    var ses = L.buildSession(p), now = performance.now();
    T = { ses: ses, i: 0, stepStart: now, startedAt: now, pausedAt: null, pausedMs: 0, skipped: 0, fired: {}, ended: false, raf: 0 };
    buildTrainingUI();
    enterStep();
    Sound.play('start');
    T.raf = requestAnimationFrame(tick);
  };
  A.pausetoggle = function () { togglePause(); };
  A.skip = function () {
    if (!T || T.ended) return;
    if (T.pausedAt !== null) resumeTraining();
    var st = T.ses.steps[T.i];
    nextStep(performance.now(), st.typ === 'uebung');
  };
  A.abbrechen = function () {
    if (!T) return;
    var wasPaused = T.pausedAt !== null;
    pauseTraining();
    confirmDlg('Training abbrechen?', 'Abgebrochene Einheiten zählen nicht für deinen Fortschritt.', 'Training abbrechen', true, 'Weiter trainieren').then(function (ok) {
      if (ok) finishTraining(true); else if (!wasPaused) resumeTraining();
    });
  };
  A.mute = function () {
    var p = prof();
    p.stumm = !p.stumm;
    save();
    $('#trMute').innerHTML = p.stumm ? I.mute : I.speaker;
    if (!p.stumm) { Sound.unlock(); Sound.play('tick'); }
    toast(p.stumm ? 'Töne aus' : 'Töne an');
  };

  // Abfrage
  A.rate = function (el) {
    if (!pending) return;
    pending[el.getAttribute('data-k')] = +el.getAttribute('data-v');
    $$('button', el.parentNode).forEach(function (b) { b.setAttribute('aria-pressed', b === el ? 'true' : 'false'); });
    $('#rateSave').disabled = !(pending.v && pending.b);
  };
  A.rateSave = function () {
    if (!pending || !pending.v || !pending.b) return;
    var p = prof(), t = L.dateKey();
    var r = L.saveUnit(p, { verspannung: pending.v, wohlbefinden: pending.b, dauerSek: pending.res.dauerSek, uebersprungen: pending.res.uebersprungen });
    var tp = L.pickTip(p, t, FM.TIPPS);
    if (tp.neu) L.markTip(p, t, tp.tip);
    pending = null;
    save();
    showSuccess(p, r, tp.tip);
  };
  A.successFertig = function (el) {
    if (el.getAttribute('data-level') === '1') { showLevelDone(); return; }
    closeLayer(); ui.tab = 'heute'; render(); window.scrollTo(0, 0);
  };
  A.level2 = function () {
    var p = prof();
    var wiederholen = p.level === 2;
    L.startLevel2(p);
    save();
    closeLayer(); ui.tab = 'heute'; render(); window.scrollTo(0, 0);
    toast(wiederholen ? 'Level 2 startet neu mit Woche 1.' : 'Level 2 freigeschaltet – los geht’s mit Woche 1.');
  };
  A.levelansicht = function () { showLevelDone(); };

  // Animierte Übungsvorschau auf „Heute“
  A.vorschau = function (el, ev) {
    if (ev && ev.target.closest('a')) return;      // Referenzlink normal öffnen
    var id = el.getAttribute('data-id'), e = EX[id];
    if (!e) return;
    var sek = +el.getAttribute('data-sek') || 0, warm = el.getAttribute('data-warm') === '1';
    var pv = { raf: 0, fig: null, t0: 0, half: -1 };
    dialog({
      title: e.name,
      html: '<div class="pv-fig"></div><div class="badges pv-badges">' + trBadges(e, el.getAttribute('data-power') === '1', false, 0) + (warm ? '<span class="badge">Warm-up · 60 s</span>' : (sek ? '<span class="badge num">2 × ' + sek + ' s</span>' : '')) + '</div>' +
        '<div class="txt"><p>' + esc(e.hint) + '</p>' + (e.side ? '<p class="pv-note">' + (e.halbzeit ? 'Zur Halbzeit: ' + esc(e.halbzeit.replace(/^Jetzt /, '')) + '.' : 'Zur Halbzeit wechselst du die Seite – die Vorschau zeigt beide Seiten im Wechsel.') + '</p>' : '') + '</div>',
      buttons: [{ label: 'Schließen', value: null, cls: 'btn-primary' }],
      onOpen: function (box) {
        pv.fig = new FM.Figure(box.querySelector('.pv-fig'));
        pv.fig.set(e.anim);
        pv.t0 = performance.now();
        (function loop() {
          var t = (performance.now() - pv.t0) / 1000;
          if (e.anim2) {
            var h = Math.floor(t / 5) % 2;
            if (h !== pv.half) { pv.half = h; pv.fig.set(h ? e.anim2 : e.anim, { mirror: h ? !!e.mirror2 : false }); }
          }
          pv.fig.render(t);
          pv.raf = requestAnimationFrame(loop);
        })();
      }
    }).then(function () { cancelAnimationFrame(pv.raf); pv.raf = 0; pv.fig = null; });
  };

  // Profile
  function switchTo(id) { store.aktivesProfil = id; save(); render(); toast('Profil gewechselt: ' + prof().name); }
  A.profilwahl = function () {
    var p = prof();
    dialog({
      title: 'Profil wechseln',
      buttons: store.profile.map(function (q) { return { label: q.name + (q.id === p.id ? ' (aktiv)' : ''), value: q.id, cls: q.id === p.id ? 'btn-primary' : 'btn-ghost' }; }).concat([{ label: 'Abbrechen', value: null }])
    }).then(function (r) { if (r.btn && r.btn !== p.id) switchTo(r.btn); });
  };
  A.profilMenu = function (el) {
    var id = el.getAttribute('data-id'), q = store.profile.filter(function (x) { return x.id === id; })[0], me = id === store.aktivesProfil;
    if (!q) return;
    var btns = [];
    if (!me) btns.push({ label: 'Zu diesem Profil wechseln', value: 'switch', cls: 'btn-primary' });
    btns.push({ label: 'Umbenennen', value: 'rename' });
    btns.push({ label: 'Profil löschen', value: 'delete', cls: 'btn-danger' });
    btns.push({ label: 'Abbrechen', value: null });
    dialog({ title: q.name, text: 'Level ' + q.level + ' · ' + L.counted(q).length + ' gezählte Einheiten', buttons: btns }).then(function (r) {
      if (r.btn === 'switch') switchTo(id);
      else if (r.btn === 'rename') renameProfile(q);
      else if (r.btn === 'delete') deleteProfile(q);
    });
  };
  function renameProfile(q) {
    dialog({ title: 'Profil umbenennen', input: { value: q.name, max: 30 }, buttons: [{ label: 'Speichern', value: 'ok', cls: 'btn-primary' }, { label: 'Abbrechen', value: null }] })
      .then(function (r) { if (r.btn === 'ok' && r.text.trim()) { q.name = r.text.trim(); save(); render(); } });
  }
  function deleteProfile(q) {
    confirmDlg('Profil „' + q.name + '“ löschen?', 'Alle Einheiten, Bewertungen und die Serie dieses Profils werden gelöscht. Das lässt sich nicht rückgängig machen.', 'Endgültig löschen', true).then(function (ok) {
      if (!ok) return;
      store.profile = store.profile.filter(function (x) { return x.id !== q.id; });
      if (store.aktivesProfil === q.id) store.aktivesProfil = store.profile.length ? store.profile[0].id : null;
      save();
      render();
      if (store.profile.length) toast('Profil gelöscht.');
    });
  }
  A.profilNeu = function () { showOnboarding(true); };

  // Training-Einstellungen
  A.toene = function () { var p = prof(); p.stumm = !p.stumm; save(); render(); };
  A.plan = function () {
    var p = prof();
    dialog({ title: 'Wenn-Dann-Plan', html: '<div class="txt"><p>Wann, wo und wie trainierst du? Ein konkreter Plan macht es dir leichter.</p></div>', input: { value: p.wennDannPlan, multi: true, rows: 3, max: 200 }, buttons: [{ label: 'Speichern', value: 'ok', cls: 'btn-primary' }, { label: 'Abbrechen', value: null }] })
      .then(function (r) { if (r.btn === 'ok') { p.wennDannPlan = r.text.trim(); save(); render(); } });
  };

  // Datensicherung
  function backupName() { return 'fit-me-backup-' + L.dateKey() + '.json'; }
  function manualCopy(json) {
    dialog({ title: 'Backup kopieren', html: '<div class="txt"><p>Markiere den Text und kopiere ihn.</p></div>', input: { value: json, multi: true, rows: 8, focus: false }, buttons: [{ label: 'Fertig', value: 'ok', cls: 'btn-primary' }] });
  }
  A.backupKopie = function () {
    var json = L.exportJSON(store);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(function () { toast('Backup in die Zwischenablage kopiert.'); }, function () { manualCopy(json); });
    } else manualCopy(json);
  };
  function downloadBlob(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Backup gespeichert.');
  }
  A.backupDatei = function () {
    var json = L.exportJSON(store), name = backupName(), blob = new Blob([json], { type: 'application/json' });
    try {
      var file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Fit-Me Backup' }).catch(function (e) { if (!e || e.name !== 'AbortError') downloadBlob(blob, name); });
        return;
      }
    } catch (e) { /* weiter mit Download */ }
    downloadBlob(blob, name);
  };
  function importText(txt) {
    var s;
    try { s = L.importJSON(txt); } catch (e) { toast(e.message); return; }
    if (!s.profile.length) { toast('Das Backup enthält kein Profil.'); return; }
    var n = s.profile.reduce(function (a, p) { return a + p.einheiten.length; }, 0);
    confirmDlg('Daten ersetzen?', 'Das Backup enthält ' + s.profile.length + (s.profile.length === 1 ? ' Profil' : ' Profile') + ' mit ' + n + ' Einheiten. Alle Fit-Me-Daten auf diesem Gerät werden dadurch ersetzt.', 'Ersetzen', true).then(function (ok) {
      if (!ok) return;
      store = s; save(); ui.tab = 'heute'; render(); toast('Backup eingespielt.');
    });
  }
  A.backupLaden = function () {
    dialog({
      title: 'Backup einspielen',
      html: '<div class="txt"><p>Wähle eine Backup-Datei oder füge den kopierten Text ein.</p></div>' +
        '<input type="file" id="bkFile" accept=".json,application/json,text/plain" hidden>' +
        '<button class="btn btn-ghost btn-block" style="margin-top:12px" id="bkPick">' + I.upload + 'Datei auswählen</button>',
      input: { multi: true, rows: 5, value: '', placeholder: 'Oder Backup-Text hier einfügen …', focus: false },
      buttons: [{ label: 'Einspielen', value: 'ok', cls: 'btn-primary' }, { label: 'Abbrechen', value: null }],
      onOpen: function (box) {
        var f = box.querySelector('#bkFile'), ta = box.querySelector('textarea');
        box.querySelector('#bkPick').addEventListener('click', function () { f.click(); });
        f.addEventListener('change', function () {
          var file = f.files && f.files[0];
          if (!file) return;
          var rd = new FileReader();
          rd.onload = function () { ta.value = String(rd.result || ''); toast('Datei geladen – jetzt „Einspielen“ tippen.'); };
          rd.readAsText(file);
        });
      }
    }).then(function (r) { if (r.btn === 'ok' && r.text.trim()) importText(r.text); });
  };

  // Fortschritt
  A.levelNeu = function () {
    var p = prof();
    confirmDlg('Level ' + p.level + ' neu starten?', 'Du beginnst wieder mit Woche 1. Deine bisherigen Einheiten bleiben im Verlauf erhalten.', 'Neu starten', false).then(function (ok) {
      if (!ok) return; L.restartLevel(p); save(); render(); toast('Level ' + p.level + ' startet wieder bei Woche 1.');
    });
  };
  A.allesReset = function () {
    var p = prof();
    confirmDlg('Gesamten Fortschritt zurücksetzen?', 'Alle Einheiten, Bewertungen und die Serie von „' + p.name + '“ werden gelöscht. Das lässt sich nicht rückgängig machen.', 'Alles zurücksetzen', true).then(function (ok) {
      if (!ok) return; L.resetAll(p); save(); render(); toast('Fortschritt zurückgesetzt.');
    });
  };

  // Info
  A.hinweis = function () {
    dialog({
      title: 'Gesundheitshinweis',
      html: '<div class="txt"><p><b style="color:var(--text)">' + HINWEIS_KURZ + '</b></p>' +
        '<p>Fit-Me und die Tipps des Tages ersetzen keine ärztliche Beratung. Führe alle Übungen langsam, kontrolliert und schmerzfrei aus – besonders die Nackenübungen.</p>' +
        '<p>Anhaltende, sich verschlimmernde oder in den Arm ausstrahlende Nackenschmerzen sowie Taubheitsgefühle gehören ärztlich abgeklärt.</p></div>'
    });
  };
  A.quellen = function () {
    dialog({
      title: 'Wissenschaftliche Quellen',
      html: '<div class="txt"><p>Auf diesen Studien und Leitlinien beruhen Trainingskonzept und Tipps. Schritte, Belastungsspitzen und Sterblichkeit stammen aus Beobachtungsstudien – sie zeigen Zusammenhänge, keinen Kausalbeweis.</p></div><ol>' +
        FM.QUELLEN.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ol>' +
        '<div class="txt" style="margin-top:12px"><p>Übungsreferenzen R1–R3 und S1–S5: <a href="' + FM.REF_LINKS.R.url + '" target="_blank" rel="noopener">' + esc(FM.REF_LINKS.R.titel) + '</a> und <a href="' + FM.REF_LINKS.S.url + '" target="_blank" rel="noopener">' + esc(FM.REF_LINKS.S.titel) + '</a>.</p></div>'
    });
  };

  /* ---------- Start ---------- */
  function dispatch(e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = A[el.getAttribute('data-act')];
    if (fn) fn(el, e);
  }
  function init() {
    load();
    document.addEventListener('click', dispatch);
    document.addEventListener('visibilitychange', function () {
      if (T && !T.ended) {
        if (document.hidden) pauseTraining();
        else if (Wake.want) Wake.on();
      } else if (!document.hidden && !$('#layer').innerHTML) render();  // neuer Tag, falls die App über Nacht offen war
    });
    window.addEventListener('pagehide', function () { if (T && !T.ended) pauseTraining(); });
    var rT;
    window.addEventListener('resize', function () {
      clearTimeout(rT);
      rT = setTimeout(function () { if (ui.tab === 'verlauf' && prof()) drawChart(prof()); }, 200);
    });
    render();
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      var hadController = !!navigator.serviceWorker.controller, reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || reloading) { hadController = true; return; }   // erste Installation: nichts tun
        if (!T && !$('#layer').innerHTML && !document.querySelector('.dlg-back')) { reloading = true; location.reload(); }
        else toast('Neue Version geladen – sie ist beim nächsten Öffnen aktiv.');
      });
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline-Cache nicht verfügbar */ });
    }
  }
  FM.app = { A: A, state: function () { return { store: store, T: T, ui: ui }; } };
  init();
})();

</script>
</body>
</html>
